<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">John Root — Field Reports</title>
  <desc id="desc">A unified dark burgundy technical panel listing Enterprise Network Defense, Gmail Automation and WebSec Lab with their operation notes.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9e263f"/>
      <stop offset=".52" stop-color="#57101b"/>
      <stop offset="1" stop-color="#2c0c13"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21090f" stop-opacity=".34"/>
      <stop offset="1" stop-color="#080607" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#fff" stroke-opacity=".018"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="428" rx="10" fill="#050405" stroke="#742237" stroke-width="2"/>
  <rect x="8" y="8" width="1184" height="414" rx="7" fill="none" stroke="#4a1723" stroke-width="1"/>
  <rect x="10" y="10" width="1180" height="410" rx="6" fill="url(#scanlines)"/>
  <rect x="12" y="12" width="1176" height="406" rx="5" fill="url(#shine)"/>

  <!-- Technical corner brackets -->
  <path d="M24 48V24H58 M1142 24H1176V58 M24 372V406H58 M1142 406H1176V372" fill="none" stroke="#b56b79" stroke-width="1.5"/>
  <path d="M28 52V28H62 M1138 28H1172V62 M28 368V402H62 M1138 402H1172V368" fill="none" stroke="#57101b" stroke-width="1"/>

  <!-- Panel heading -->
  <text x="76" y="51" fill="#9e858b" font-family="monospace" font-size="13" letter-spacing="3.2">JOHN-ROOT-OPSEC / FIELD REPORTS</text>
  <text x="1008" y="51" text-anchor="end" fill="#8c263b" font-family="monospace" font-size="11" letter-spacing="2.2">LAB LOG / 03 ENTRIES</text>

  <!-- Animated technical reticle, matching the Operator File motif -->
  <g transform="translate(1090 49)">
    <circle r="29" fill="none" stroke="#8e263c" stroke-width="1.2" opacity=".78"/>
    <circle r="22" fill="none" stroke="#692033" stroke-width="1" opacity=".78"/>
    <circle r="16" fill="none" stroke="#4d1928" stroke-width=".8" opacity=".8"/>

    <circle r="25" fill="none" stroke="#bd304e" stroke-width="1" opacity="0">
      <animate attributeName="r" values="15;28;15" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".55;0;.55" dur="5.5s" repeatCount="indefinite"/>
    </circle>

    <g stroke="#8f263d" stroke-width="1" opacity=".72">
      <path d="M0 -37V-32 M0 32V37 M-37 0H-32 M32 0H37"/>
      <path d="M-26 -26L-22 -22 M26 -26L22 -22 M-26 26L-22 22 M26 26L22 22" opacity=".65"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="34s" repeatCount="indefinite"/>
    </g>

    <path d="M0 0 L0 -21 A21 21 0 0 1 14.85 -14.85 Z"
          fill="#a92745" opacity=".13">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".08;.2;.08" dur="9s" repeatCount="indefinite"/>
    </path>

    <g>
      <rect x="-10" y="-10" width="20" height="20" fill="none" stroke="#b83250" stroke-width="1.15"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </g>

    <circle r="3" fill="#c13250">
      <animate attributeName="r" values="2.3;4;2.3" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".65;1;.65" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <line x1="58" y1="72" x2="1142" y2="72" stroke="#6b1b2c" stroke-width="1"/>
  <line x1="58" y1="74" x2="1142" y2="74" stroke="#2b1118" stroke-width="1"/>
  <circle cx="600" cy="73" r="4" fill="#ad304b"/>
  <circle cx="600" cy="73" r="8" fill="#ad304b" opacity=".18" filter="url(#softGlow)"/>

  <!-- Column headings -->
  <text x="78" y="108" fill="#c04a62" font-family="monospace" font-size="13" font-weight="700" letter-spacing="2.6">PROJECT</text>
  <text x="472" y="108" fill="#c04a62" font-family="monospace" font-size="13" font-weight="700" letter-spacing="2.6">OPERATION NOTES</text>
  <text x="1120" y="108" text-anchor="end" fill="#75535c" font-family="monospace" font-size="10" letter-spacing="1.6">AUTHORIZED WORK</text>

  <!-- Column divider -->
  <line x1="438" y1="91" x2="438" y2="371" stroke="#672033" stroke-width="1"/>
  <line x1="440" y1="91" x2="440" y2="371" stroke="#2b1118" stroke-width="1"/>

  <!-- Row 01 -->
  <line x1="58" y1="126" x2="1142" y2="126" stroke="#49202a" stroke-width="1"/>
  <rect x="58" y="127" width="1084" height="88" fill="#0a0507" opacity=".82"/>
  <rect x="58" y="127" width="3" height="88" fill="url(#edge)"/>
  <text x="78" y="157" fill="#b93450" font-family="monospace" font-size="13" letter-spacing="2">01</text>
  <a href="https://github.com/john-root-opsec/enterprise-network-defense-in-depth">
    <text x="78" y="188" fill="#eee4e7" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700">Enterprise Network Defense</text>
  </a>
  <circle cx="468" cy="169" r="4" fill="#a92d48"/>
  <text x="490" y="163" fill="#d2c7cb" font-family="Arial, sans-serif" font-size="18">Corporate network design · VLANs · routing · ACLs · DHCP · DNS</text>
  <text x="490" y="190" fill="#826b73" font-family="monospace" font-size="11" letter-spacing="2">NETWORK INFRASTRUCTURE / DOCUMENTED</text>

  <!-- Row 02 -->
  <line x1="58" y1="215" x2="1142" y2="215" stroke="#49202a" stroke-width="1"/>
  <rect x="58" y="216" width="1084" height="88" fill="#07080b" opacity=".96"/>
  <rect x="58" y="216" width="3" height="88" fill="url(#edge)"/>
  <text x="78" y="246" fill="#b93450" font-family="monospace" font-size="13" letter-spacing="2">02</text>
  <a href="https://github.com/john-root-opsec/gmail-auto-cleaner">
    <text x="78" y="277" fill="#eee4e7" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700">Gmail Automation</text>
  </a>
  <circle cx="468" cy="258" r="4" fill="#a92d48"/>
  <text x="490" y="252" fill="#d2c7cb" font-family="Arial, sans-serif" font-size="18">Python · Gmail API · OAuth 2.0 · REST · pagination</text>
  <text x="490" y="279" fill="#d2c7cb" font-family="Arial, sans-serif" font-size="18">Batch processing</text>
  <text x="490" y="296" fill="#826b73" font-family="monospace" font-size="11" letter-spacing="2">PYTHON AUTOMATION / DOCUMENTED</text>

  <!-- Row 03 -->
  <line x1="58" y1="304" x2="1142" y2="304" stroke="#49202a" stroke-width="1"/>
  <rect x="58" y="305" width="1084" height="66" fill="#0a0507" opacity=".82"/>
  <rect x="58" y="305" width="3" height="66" fill="url(#edge)"/>
  <text x="78" y="336" fill="#b93450" font-family="monospace" font-size="13" letter-spacing="2">03</text>
  <a href="https://github.com/john-root-opsec/websec-lab">
    <text x="78" y="355" fill="#eee4e7" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700">WebSec Lab</text>
  </a>
  <circle cx="468" cy="338" r="4" fill="#a92d48"/>
  <text x="490" y="332" fill="#d2c7cb" font-family="Arial, sans-serif" font-size="18">Controlled web security lab · HTTP analysis · Python detection concepts</text>
  <text x="490" y="355" fill="#c18a55" font-family="monospace" font-size="11" letter-spacing="2">WEB SECURITY / IN DEVELOPMENT</text>

  <!-- Footer rule -->
  <line x1="58" y1="386" x2="1142" y2="386" stroke="#6b1b2c" stroke-width="1"/>
  <text x="78" y="407" fill="#8b747a" font-family="monospace" font-size="10" letter-spacing="2">OBSERVE / DOCUMENT / IMPROVE</text>
  <text x="1122" y="407" text-anchor="end" fill="#702234" font-family="monospace" font-size="10" letter-spacing="2">END OF REPORT</text>
</svg>