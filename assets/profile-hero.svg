<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">João Batista — Infrastructure, Networking and Cybersecurity</title>
<desc id="desc">Dark editorial cybersecurity profile banner with technical grid, red skyline, eclipse and profile information.</desc>
